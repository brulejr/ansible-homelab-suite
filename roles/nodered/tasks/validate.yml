---
- name: Validate Node-RED required variables
  ansible.builtin.assert:
    that:
      - nodered_stack_name | length > 0
      - nodered_container_name | length > 0
      - nodered_app_dir | length > 0
      - nodered_data_dir | length > 0
      - nodered_image | length > 0
      - nodered_docker_network | length > 0
      - nodered_host_port is defined
    fail_msg: "Node-RED role configuration is invalid."

- name: Validate Node-RED MQTT broker logins
  ansible.builtin.assert:
    that:
      - nodered_mqtt_broker_logins | rejectattr('id', 'defined') | list | length == 0
      - nodered_mqtt_broker_logins | rejectattr('user', 'defined') | list | length == 0
      - nodered_mqtt_broker_logins | rejectattr('password', 'defined') | list | length == 0
      - nodered_mqtt_broker_logins | map(attribute='id') | unique | list | length
        == nodered_mqtt_broker_logins | length
    fail_msg: "Each of nodered_mqtt_broker_logins needs a unique id, a user and a password."

- name: Validate Node-RED palette modules
  ansible.builtin.assert:
    that:
      - nodered_palette_modules | rejectattr('name', 'defined') | list | length == 0
      - nodered_palette_modules | rejectattr('version', 'defined') | list | length == 0
    fail_msg: "Each of nodered_palette_modules needs a name and a version."
