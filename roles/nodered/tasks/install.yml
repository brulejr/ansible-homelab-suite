---
- name: Ensure Node-RED app directory exists
  ansible.builtin.file:
    path: "{{ nodered_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Node-RED data directory exists
  ansible.builtin.file:
    path: "{{ nodered_data_dir }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Render Node-RED docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nodered_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nodered

- name: Start Node-RED stack
  community.docker.docker_compose_v2:
    project_src: "{{ nodered_app_dir }}"
    project_name: "{{ nodered_stack_name }}"
    state: present
    pull: always
