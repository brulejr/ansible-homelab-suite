---
- name: Wait for Homarr HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ homarr_bind_ip }}:{{ homarr_host_port }}"
    method: GET
    status_code:
      - 200
      - 302
      - 401
    validate_certs: false
  register: homarr_verify_result
  retries: "{{ (homarr_verify_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  until: homarr_verify_result.status in [200, 302, 401]
