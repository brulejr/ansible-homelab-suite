---
# configuration.yaml is generated by Home Assistant on first start; wait for it
# rather than creating it, so HA still writes its defaults.
- name: Wait for Home Assistant configuration.yaml
  ansible.builtin.wait_for:
    path: "{{ homeassistant_config_dir }}/configuration.yaml"
    timeout: "{{ homeassistant_verify_timeout }}"

- name: Read Home Assistant configuration.yaml
  ansible.builtin.slurp:
    src: "{{ homeassistant_config_dir }}/configuration.yaml"
  register: homeassistant_configuration_yaml

- name: Ensure configuration.yaml has no unmanaged lovelace key
  ansible.builtin.assert:
    that:
      - >-
        homeassistant_configuration_yaml.content | b64decode
        | regex_replace('(?s)# BEGIN ANSIBLE MANAGED LOVELACE.*# END ANSIBLE MANAGED LOVELACE', '')
        is not search('(?m)^lovelace:')
    fail_msg: >-
      configuration.yaml already defines 'lovelace:'. Move it into
      homeassistant_frontend_modules / homeassistant_dashboards and remove it.

- name: Ensure Home Assistant frontend directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ homeassistant_puid }}"
    group: "{{ homeassistant_pgid }}"
    mode: "0755"
  loop:
    - "{{ homeassistant_www_dir }}"
    - "{{ homeassistant_dashboards_dir }}"

- name: Install Home Assistant frontend modules
  ansible.builtin.include_tasks: frontend_module.yml
  loop: "{{ homeassistant_frontend_modules }}"
  loop_control:
    loop_var: homeassistant_frontend_module
    label: "{{ homeassistant_frontend_module.name }} {{ homeassistant_frontend_module.version }}"

# Dashboard content is re-read by the frontend on refresh; no restart needed.
- name: Render Home Assistant dashboards
  ansible.builtin.copy:
    content: "{{ item.config | to_nice_yaml(indent=2, sort_keys=False, width=1000) }}"
    dest: "{{ homeassistant_dashboards_dir }}/{{ item.url_path }}.yaml"
    owner: "{{ homeassistant_puid }}"
    group: "{{ homeassistant_pgid }}"
    mode: "0644"
  loop: "{{ homeassistant_dashboards }}"
  loop_control:
    label: "{{ item.url_path }}"

# Registering dashboards and resources only takes effect on restart.
- name: Configure Lovelace in configuration.yaml
  ansible.builtin.blockinfile:
    path: "{{ homeassistant_config_dir }}/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED LOVELACE"
    block: "{{ lookup('ansible.builtin.template', 'lovelace.yaml.j2') }}"
    state: "{{ 'present' if (homeassistant_frontend_modules or homeassistant_dashboards) else 'absent' }}"
  notify: Restart homeassistant
