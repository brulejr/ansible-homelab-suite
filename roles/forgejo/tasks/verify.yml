---
- name: Check Forgejo container state
  community.docker.docker_container_info:
    name: "{{ forgejo_container_name }}"
  register: forgejo_container_info

- name: Assert Forgejo container is running
  ansible.builtin.assert:
    that:
      - forgejo_container_info.exists
      - forgejo_container_info.container.State.Running
    fail_msg: "Forgejo container is not running"

- name: Wait for Forgejo SSH
  ansible.builtin.wait_for:
    host: "{{ forgejo_ssh_bind_ip }}"
    port: "{{ forgejo_ssh_host_port | int }}"
    search_regex: OpenSSH
    timeout: 60
