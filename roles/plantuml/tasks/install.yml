---
- name: Ensure PlantUML app directory exists
  ansible.builtin.file:
    path: "{{ plantuml_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure PlantUML data directory exists
  ansible.builtin.file:
    path: "{{ plantuml_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render PlantUML docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ plantuml_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart plantuml

- name: Start PlantUML stack
  community.docker.docker_compose_v2:
    project_src: "{{ plantuml_app_dir }}"
    project_name: "{{ plantuml_stack_name }}"
    state: present
    pull: always
