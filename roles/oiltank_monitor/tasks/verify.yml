---
- name: Check oiltank-monitor container state
  community.docker.docker_container_info:
    name: "{{ oiltank_monitor_container_name }}"
  register: oiltank_monitor_container_info

- name: Assert oiltank-monitor container is running
  ansible.builtin.assert:
    that:
      - oiltank_monitor_container_info.exists
      - oiltank_monitor_container_info.container.State.Running
    fail_msg: >-
      Container {{ oiltank_monitor_container_name }} is not running.
      Status={{ oiltank_monitor_container_info.container.State.Status | default('missing') }},
      exit_code={{ oiltank_monitor_container_info.container.State.ExitCode | default('unknown') }}

# 503 until a snapshot has been read and the broker is reachable; the first
# capture comes about 30 seconds after start-up
- name: Wait for oiltank-monitor health endpoint
  ansible.builtin.uri:
    url: "http://{{ oiltank_monitor_bind_ip }}:{{ oiltank_monitor_host_port }}/mgmt/health"
    method: GET
    status_code: 200
  register: oiltank_monitor_health
  retries: "{{ (oiltank_monitor_verify_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  until: oiltank_monitor_health.status == 200
