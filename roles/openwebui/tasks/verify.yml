---
- name: Wait for Open WebUI HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openwebui_host_port }}"
    method: GET
    status_code:
      - 200
      - 302
  register: openwebui_http_check
  retries: 30
  delay: 3
  until: openwebui_http_check.status in [200, 302]

- name: Check Open WebUI container state
  community.docker.docker_container_info:
    name: "{{ openwebui_container_name }}"
  register: openwebui_container_info

- name: Assert Open WebUI container is running
  ansible.builtin.assert:
    that:
      - openwebui_container_info.exists
      - openwebui_container_info.container.State.Running
    fail_msg: "Open WebUI container is not running"
