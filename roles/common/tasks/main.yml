---
# tasks file for common

- name: Validate required site identity vars
  ansible.builtin.assert:
    that:
      - domain_name is defined
      - domain_name not in ["example.invalid", "invalid", "example.com"]
      - homelab_name is defined
      - homelab_name not in ["example.homelab", "example"]
    fail_msg: >
      domain_name/homelab_name must be set in the inventory (group_vars/host_vars).
      Current domain_name={{ domain_name }}, homelab_name={{ homelab_name }}.

- name: Find stray/conflicting apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "{{ item.patterns }}"
    excludes: "{{ item.keep }}"
  register: _stray_apt_sources
  loop: "{{ apt_source_reconciliations }}"
  loop_control:
    label: "{{ item.keep }}"

- name: Remove stray/conflicting apt source files
  ansible.builtin.file:
    path: "{{ file_item.path }}"
    state: absent
  loop: "{{ _stray_apt_sources.results | map(attribute='files') | flatten }}"
  loop_control:
    loop_var: file_item
    label: "{{ file_item.path }}"

- name: Update apt packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: yes

- name: Check if reboot required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Reboot if required
  ansible.builtin.reboot:
    msg: Rebooting due to a kernel update
    test_command: uptime
  when: reboot_required_file.stat.exists

- name: Copy over the standard aliases file
  template: src=standard-aliases.sh dest=/etc/profile.d

- name: Install packages
  ansible.builtin.package:
    name: "{{ packages }}"
    state: present

- name: Ensure venv support exists
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
  when: ansible_distribution == "Ubuntu"

- name: Install pip packages into common venv
  ansible.builtin.pip:
    name: "{{ pip_packages }}"
    virtualenv: /opt/common-venv
    virtualenv_command: python3 -m venv
    state: present
