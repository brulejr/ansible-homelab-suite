---
# Broker config nodes are built in the editor, and their logins are kept in
# Node-RED's encrypted credentials, so a script on the host sets only the
# login over the admin API. The passwords go in on stdin, hence no_log.
- name: Set Node-RED MQTT broker logins
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'set_broker_logins.py') }}"
    stdin: >-
      {{ {'url': 'http://' ~ nodered_bind_ip ~ ':' ~ nodered_host_port,
          'username': nodered_admin_user, 'password': nodered_admin_password,
          'state_file': nodered_app_dir ~ '/broker_logins.json',
          'brokers': nodered_mqtt_broker_logins} | to_json }}
  register: nodered_broker_logins_result
  changed_when: >-
    nodered_broker_logins_result.rc == 0
    and (nodered_broker_logins_result.stdout | from_json).changed | length > 0
  failed_when: false
  no_log: true

- name: Check Node-RED MQTT broker logins
  ansible.builtin.assert:
    that:
      - nodered_broker_logins_result.rc == 0
      - (nodered_broker_logins_result.stdout | from_json).errors | length == 0
    fail_msg: >-
      {% if nodered_broker_logins_result.rc != 0 %}Node-RED broker login update failed:
      {{ nodered_broker_logins_result.stderr_lines | default(['no output'], true) | last }}
      {% else %}{{ (nodered_broker_logins_result.stdout | from_json).errors | join('; ') }}{% endif %}
    success_msg: >-
      {% if nodered_broker_logins_result.rc == 0 %}
      Changed: {{ (nodered_broker_logins_result.stdout | from_json).changed | join(', ') or 'none' }}.{% endif %}
