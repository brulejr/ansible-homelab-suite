---
# ---------------------------------------------------------------------------
# Kernel: free the dongle from the DVB-T drivers
# ---------------------------------------------------------------------------
- name: Blacklist the DVB-T drivers that claim RTL-SDR dongles
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-rtl-sdr.conf
    content: |
      # Managed by Ansible (soapysdr): the SDR drivers can't open a dongle
      # these have claimed as a TV tuner
      {% for module in soapysdr_blacklist_modules %}
      blacklist {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: soapysdr_blacklist_dvb | bool

- name: Remove the DVB-T driver blacklist
  ansible.builtin.file:
    path: /etc/modprobe.d/blacklist-rtl-sdr.conf
    state: absent
  when: not (soapysdr_blacklist_dvb | bool)

# In order: each module is used by the ones before it
- name: Unload the DVB-T drivers
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: "{{ soapysdr_blacklist_modules }}"
  when: soapysdr_blacklist_dvb | bool
  # Restarting releases the device if the server had found it claimed
  notify: Restart soapysdr

# ---------------------------------------------------------------------------
# Image and container
# ---------------------------------------------------------------------------
- name: Ensure soapysdr app directory exists
  ansible.builtin.file:
    path: "{{ soapysdr_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render soapysdr Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ soapysdr_app_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"

- name: Set soapysdr image version
  ansible.builtin.set_fact:
    soapysdr_version: "{{ (lookup('ansible.builtin.template', 'Dockerfile.j2') | hash('sha1'))[:12] }}"

- name: Look up soapysdr image for this Dockerfile
  community.docker.docker_image_info:
    name: "{{ soapysdr_image_name }}:{{ soapysdr_version }}"
  register: soapysdr_image_info

- name: Decide whether to build the soapysdr image
  ansible.builtin.set_fact:
    soapysdr_needs_build: "{{ (soapysdr_force_rebuild | bool) or (soapysdr_image_info.images | length == 0) }}"

- name: Render soapysdr docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ soapysdr_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start soapysdr stack
  community.docker.docker_compose_v2:
    project_src: "{{ soapysdr_app_dir }}"
    project_name: "{{ soapysdr_stack_name }}"
    state: present
    build: "{{ 'always' if soapysdr_needs_build | bool else 'never' }}"
    pull: policy
    remove_orphans: true

- name: Apply soapysdr restarts now
  ansible.builtin.meta: flush_handlers

# Each Dockerfile change leaves an image behind; keep only the one now running
- name: List soapysdr images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - ls
      - --filter
      - "reference={{ soapysdr_image_name }}"
      - --format
      - "{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"
  register: soapysdr_image_list
  changed_when: false

- name: Remove superseded soapysdr images
  community.docker.docker_image_remove:
    name: "{{ item }}"
  loop: >-
    {{
      soapysdr_image_list.stdout_lines
      | reject('equalto', soapysdr_image_name ~ ':' ~ soapysdr_version)
      | reject('search', ':<none>$')
      | list
    }}
