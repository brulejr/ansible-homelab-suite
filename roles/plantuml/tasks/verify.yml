---
- name: Wait for PlantUML HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ plantuml_host_port }}"
    method: GET
    status_code:
      - 200
      - 302
  register: plantuml_http_check
  retries: 20
  delay: 3
  until: plantuml_http_check.status in [200, 302]

- name: Check PlantUML container state
  community.docker.docker_container_info:
    name: "{{ plantuml_container_name }}"
  register: plantuml_container_info

- name: Assert PlantUML container is running
  ansible.builtin.assert:
    that:
      - plantuml_container_info.exists
      - plantuml_container_info.container.State.Running
    fail_msg: "PlantUML container is not running"
