---
- name: Ensure Ollama app directory exists
  ansible.builtin.file:
    path: "{{ ollama_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Ollama data directory exists
  ansible.builtin.file:
    path: "{{ ollama_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Ollama docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ollama_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ollama

- name: Start Ollama stack
  community.docker.docker_compose_v2:
    project_src: "{{ ollama_app_dir }}"
    project_name: "{{ ollama_stack_name }}"
    state: present
    pull: always
