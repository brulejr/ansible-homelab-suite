---
# The MQTT integration is set up in the UI and has no YAML configuration, so
# its entry's login is compared in Home Assistant's storage and set through the
# entry's reconfigure flow. Passwords are involved throughout, hence no_log.
- name: Read Home Assistant config entries
  ansible.builtin.slurp:
    src: "{{ homeassistant_config_dir }}/.storage/core.config_entries"
  register: homeassistant_config_entries_file
  no_log: true

- name: Find Home Assistant MQTT entry
  ansible.builtin.set_fact:
    homeassistant_mqtt_entry: >-
      {{ (homeassistant_config_entries_file.content | b64decode | from_json).data.entries
         | selectattr('domain', 'equalto', 'mqtt') | first | default({}) }}
  no_log: true

- name: Check Home Assistant has an MQTT entry
  ansible.builtin.assert:
    that:
      - homeassistant_mqtt_entry | length > 0
    fail_msg: >-
      Home Assistant has no MQTT integration to set the login on; add it in
      the UI (Settings → Devices & services) first.

- name: Set Home Assistant MQTT login
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'set_mqtt_login.py') }}"
    stdin: >-
      {{ {'token': homeassistant_api_token,
          'url': homeassistant_api_url,
          'entry_id': homeassistant_mqtt_entry.entry_id,
          'username': homeassistant_mqtt_username,
          'password': homeassistant_mqtt_password} | to_json }}
  register: homeassistant_mqtt_login_result
  changed_when: >-
    homeassistant_mqtt_login_result.rc == 0
    and (homeassistant_mqtt_login_result.stdout | from_json).changed
  failed_when: false
  when: >-
    homeassistant_mqtt_entry.data.username | default('') != homeassistant_mqtt_username
    or homeassistant_mqtt_entry.data.password | default('') != homeassistant_mqtt_password
  no_log: true

- name: Check Home Assistant MQTT login
  ansible.builtin.assert:
    that:
      - homeassistant_mqtt_login_result.rc == 0
      - (homeassistant_mqtt_login_result.stdout | from_json).errors | length == 0
    fail_msg: >-
      {% if homeassistant_mqtt_login_result.rc != 0 %}Setting the MQTT login failed:
      {{ homeassistant_mqtt_login_result.stderr_lines | default(['no output'], true) | last }}
      {% else %}{{ (homeassistant_mqtt_login_result.stdout | from_json).errors | join('; ') }}{% endif %}
  when: homeassistant_mqtt_login_result is not skipped
