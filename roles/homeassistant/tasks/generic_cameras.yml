---
# The Generic Camera integration has no YAML configuration and no duplicate
# check, so a script creates each missing entry through the config flow and
# names its entity, from inside the Home Assistant container (which has Python
# and aiohttp). The token and stream credentials go in on stdin, hence no_log.
- name: Add missing Home Assistant Generic Cameras
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ homeassistant_container_name }}"
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'ensure_generic_cameras.py') }}"
    stdin: >-
      {{ {'token': homeassistant_api_token,
          'url': 'http://127.0.0.1:' ~ homeassistant_container_port,
          'cameras': homeassistant_generic_cameras} | to_json }}
  register: homeassistant_generic_cameras_result
  changed_when: >-
    homeassistant_generic_cameras_result.rc == 0
    and ((homeassistant_generic_cameras_result.stdout | from_json).created
         + (homeassistant_generic_cameras_result.stdout | from_json).changed) | length > 0
  failed_when: false
  no_log: true

- name: Check Home Assistant Generic Cameras
  ansible.builtin.assert:
    that:
      - homeassistant_generic_cameras_result.rc == 0
      - (homeassistant_generic_cameras_result.stdout | from_json).errors | length == 0
    fail_msg: >-
      {% if homeassistant_generic_cameras_result.rc != 0 %}Generic Camera setup failed:
      {{ homeassistant_generic_cameras_result.stderr_lines | default(['no output'], true) | last }}
      {% else %}{{ (homeassistant_generic_cameras_result.stdout | from_json).errors | join('; ') }}{% endif %}
    success_msg: >-
      {% if homeassistant_generic_cameras_result.rc == 0 %}{% set r = homeassistant_generic_cameras_result.stdout | from_json %}
      Created: {{ r.created | join(', ') or 'none' }}. Changed: {{ r.changed | join(', ') or 'none' }}.{% endif %}
