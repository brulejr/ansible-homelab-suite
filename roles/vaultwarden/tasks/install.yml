---
- name: Ensure Vaultwarden app directory exists
  ansible.builtin.file:
    path: "{{ vaultwarden_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Vaultwarden runs as root. The database, the token signing key and config.json
# are secret, so other users on the host are kept out.
- name: Ensure Vaultwarden data directory exists
  ansible.builtin.file:
    path: "{{ vaultwarden_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Compose reads it into the container's environment, so a change recreates
# Vaultwarden on the start step
- name: Render Vaultwarden environment file
  ansible.builtin.template:
    src: vaultwarden.env.j2
    dest: "{{ vaultwarden_app_dir }}/vaultwarden.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render Vaultwarden docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Vaultwarden stack
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_app_dir }}"
    project_name: "{{ vaultwarden_stack_name }}"
    state: present
    pull: always
