---
- name: Setup the iot automation servers
  hosts: iot_servers
  become: true
  roles:
    - common
    - docker
    - watchtower
    # Before its clients, which log in with the users it creates
    - mqtt
    - docker2mqtt
    - traefik
    - traefik_apps
    - lldap
    - authelia
    - esphome
    - homeassistant
    - iot_pipeline
    - oiltank_monitor
    - nodered
    - ring_mqtt
    - wikigo
    - zigbee2mqtt
    - forgejo
    # Last, after every app whose data it snapshots
    - config_snapshot
