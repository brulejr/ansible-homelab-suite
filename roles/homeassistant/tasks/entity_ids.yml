---
# Entity ids can only be set over the WebSocket API, so a script does it from
# inside the Home Assistant container, as for device areas. The token goes in
# on stdin, hence no_log.
- name: Give Home Assistant entities their entity ids
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ homeassistant_container_name }}"
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'assign_entity_ids.py') }}"
    stdin: >-
      {{ {'token': homeassistant_api_token,
          'url': 'ws://127.0.0.1:' ~ homeassistant_container_port ~ '/api/websocket',
          'entities': homeassistant_entity_ids} | to_json }}
  register: homeassistant_entity_ids_result
  changed_when: >-
    homeassistant_entity_ids_result.rc == 0
    and (homeassistant_entity_ids_result.stdout | from_json).changed | length > 0
  # Judged by the next task, since no_log would hide the reason
  failed_when: false
  no_log: true

# An id still held by another entity is not an error: it is assigned once
# that entity is removed, on a later deploy
- name: Check Home Assistant entity ids
  ansible.builtin.assert:
    that:
      - homeassistant_entity_ids_result.rc == 0
      - (homeassistant_entity_ids_result.stdout | from_json).missing | length == 0
    fail_msg: >-
      {% if homeassistant_entity_ids_result.rc != 0 %}Entity id assignment failed:
      {{ homeassistant_entity_ids_result.stderr_lines | default(['no output'], true) | last }}
      {% else %}No entity found for {{ (homeassistant_entity_ids_result.stdout | from_json).missing | join(', ') }}.{% endif %}
    success_msg: >-
      {% set r = homeassistant_entity_ids_result.stdout | from_json %}
      Renamed: {{ r.changed | join(', ') or 'none' }}.
      {% if r.blocked %}Waiting: {{ r.blocked | join('; ') }}.{% endif %}
