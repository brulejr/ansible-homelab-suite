---
- name: Check ring-mqtt container state
  community.docker.docker_container_info:
    name: "{{ ring_mqtt_container_name }}"
  register: ring_mqtt_container_info

# Without a refresh token the container still runs, waiting on the web UI
- name: Assert ring-mqtt container is running
  ansible.builtin.assert:
    that:
      - ring_mqtt_container_info.exists
      - ring_mqtt_container_info.container.State.Running
    fail_msg: >-
      Container {{ ring_mqtt_container_name }} is not running.
      Status={{ ring_mqtt_container_info.container.State.Status | default('missing') }},
      exit_code={{ ring_mqtt_container_info.container.State.ExitCode | default('unknown') }}
