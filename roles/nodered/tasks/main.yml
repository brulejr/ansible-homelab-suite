---
- name: Validate Node-RED configuration
  ansible.builtin.include_tasks: validate.yml
  when: nodered_enabled | bool

- name: Install and configure Node-RED
  ansible.builtin.include_tasks: install.yml
  when: nodered_enabled | bool

- name: Verify Node-RED
  ansible.builtin.include_tasks: verify.yml
  when:
    - nodered_enabled | bool
    - nodered_verify_enabled | bool

- name: Deploy Node-RED flow tabs
  ansible.builtin.include_tasks: flow_tabs.yml
  when:
    - nodered_enabled | bool
    - nodered_flow_tab_files | length > 0
